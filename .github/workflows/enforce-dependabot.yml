name: Enforce Dependabot Config

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the generated configs, open no PRs
        type: boolean
        default: false

# Requires ORG_PAT set as an org-level secret: a PAT (or app token) with
# contents + pull-requests write on all org repos.
# Without it the workflow warns and exits cleanly — it is never a hard failure.

permissions:
  contents: read

jobs:
  enforce-dependabot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add dependabot.yml to repos missing it
        env:
          GH_TOKEN: ${{ secrets.ORG_PAT }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ORG_PAT not set — skipping. Add a token with repo access as org secret ORG_PAT."
            exit 0
          fi
          python3 .github/scripts/enforce_dependabot.py "$ORG" $DRY_RUN
