name: ci (reusable)

# Org-wide minimum CI standard. Each repo calls this on PR + push to main:
#
#   name: ci
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     ci:
#       uses: ekd-akd/.github/.github/workflows/ci.yml@main
#       with:
#         language: python   # python | node | static
#
# It produces a single `ci` job that is meant to be the required status check on
# main — which both enforces the baseline and makes release-PR auto-merge valid.
#
# Philosophy: lint + format + test where they exist, fail loudly on real
# failures, and stay a trivial green for content-only repos. Steps self-skip
# when their tooling/config isn't present, so one workflow fits every repo.

on:
  workflow_call:
    inputs:
      language:
        description: "python | node | static"
        type: string
        required: true
      python-version:
        type: string
        required: false
        default: "3.12"
      node-version:
        type: string
        required: false
        default: "20"
      # Opt-in strict Python gates. Off by default so the baseline stays a
      # trivial green for content-only repos; a repo that wants the stricter
      # gate enables these explicitly (it is the caller's deliberate choice,
      # not a surprise that blocks every auto-merge).
      ruff-format:
        description: "python: enforce `ruff format --check`"
        type: boolean
        required: false
        default: false
      ty:
        description: "python: run the `ty` type checker"
        type: boolean
        required: false
        default: false
      ty-paths:
        description: "python: paths passed to `ty check`"
        type: string
        required: false
        default: "src"
      ruff-version:
        description: >-
          python: ruff version pin for `uvx ruff@<version>`. `uvx ruff` with no
          pin always fetches PyPI's latest release at run time, ignoring the
          repo's own pyproject/uv.lock pin — a new ruff release can then add or
          promote rules that fail every repo's CI simultaneously with no repo
          change. Bump this deliberately (and test) rather than dropping it.
        type: string
        required: false
        default: "0.15.22"
      auth-registry:
        description: >-
          python: check out ekd-akd/oauth (read-only, depth 1) and export AKD_AUTH_REGISTRY, the path of its
          auth-registry.yaml, for the test run, so a service can test its auth defaults against the registry
          (akd_auth.registry). Needs the private-dependency credentials of the step above, so it is only
          meaningful on the self-hosted runner. Off by default.
        type: boolean
        required: false
        default: false
      submodules:
        description: "actions/checkout submodules: 'false' | 'true' | 'recursive'"
        type: string
        required: false
        default: 'false'
      runs-on:
        # JSON array of runner labels. Default stays GitHub-hosted, so public repos
        # (and this one) keep working unchanged. Private AKD repos opt in with
        # '["self-hosted", "akd"]', like release.yml. The self-hosted runner refuses
        # public-repo jobs (allows_public_repositories=false).
        description: "JSON array of runner labels"
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      SUBMODULE_TOKEN:
        description: "Token with contents:read on the private submodule repos; set as a repo secret in the caller"
        required: false
      ORG_PAT:
        description: >-
          Org-wide read token, used to fetch private ekd-akd git dependencies (SUBMODULE_TOKEN is the fallback).
          Only used when the repo actually has such a dependency. Reaches the workflow with `secrets: inherit`.
        required: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # Private ekd-akd git dependencies (e.g. akd-auth): uv fetches them with the git CLI, which needs read
      # access to the private repo. Only runs for Python repos that declare such a dependency; every other
      # repo, and any run without a token, behaves exactly as before.
      # Token source, first hit wins:
      #   1. the host file /etc/nuklaut/secrets/private-deps-token (first non-blank line). The self-hosted
      #      runners mount /etc/nuklaut read-only, so no GitHub secret is needed in the consuming repo.
      #   2. secrets ORG_PAT / SUBMODULE_TOKEN (GitHub-hosted runners; needs a repo-level secret on the Free plan).
      # The credential goes in through GIT_CONFIG_* environment variables for this job only: nothing is written
      # to ~/.gitconfig, so it cannot outlive the job on the self-hosted runner. The value is masked in the log.
      - name: Git credentials for private ekd-akd dependencies
        if: ${{ inputs.language == 'python' }}
        env:
          TOKEN: ${{ secrets.ORG_PAT || secrets.SUBMODULE_TOKEN }}
          TOKEN_FILE: /etc/nuklaut/secrets/private-deps-token
        run: |
          set -euo pipefail
          if ! git grep -q -E '(git\+|git = ")https://github\.com/ekd-akd/' -- '*pyproject.toml' '*uv.lock'; then
            echo "no private ekd-akd git dependency — skipping"
            exit 0
          fi
          source=secret
          if [ -r "$TOKEN_FILE" ]; then
            TOKEN="$(grep -m1 -v '^[[:space:]]*$' "$TOKEN_FILE" | tr -d '\r' || true)"
            source=host-file
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::private ekd-akd git dependency found but no token: neither $TOKEN_FILE on the runner nor ORG_PAT/SUBMODULE_TOKEN as a repo-level secret reached this job; uv sync will fail"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${TOKEN}@github.com/ekd-akd/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/ekd-akd/"
          } >> "$GITHUB_ENV"
          echo "git credentials for github.com/ekd-akd configured for this job (source: $source)"

      # Opt-in (auth-registry: true): the auth registry of ekd-akd/oauth for conformance tests. Uses the git
      # credentials exported by the step above (GIT_CONFIG_* in GITHUB_ENV, this job only). Fails closed: a
      # caller that asks for the registry and cannot get it must not silently skip the check.
      - name: Auth registry for conformance tests
        if: ${{ inputs.language == 'python' && inputs.auth-registry }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_CONFIG_COUNT:-}" ]; then
            echo "::error::auth-registry requested but no git credentials for ekd-akd are set (no private ekd-akd git dependency, or no token reached this job)"
            exit 1
          fi
          git clone --depth 1 https://github.com/ekd-akd/oauth.git "${RUNNER_TEMP}/oauth"
          test -s "${RUNNER_TEMP}/oauth/auth-registry.yaml"
          echo "AKD_AUTH_REGISTRY=${RUNNER_TEMP}/oauth/auth-registry.yaml" >> "$GITHUB_ENV"
          echo "auth registry: $(git -C "${RUNNER_TEMP}/oauth" rev-parse --short HEAD)"

      # ---- Python: ruff lint + format check, pytest when a suite exists --------
      - name: Set up uv
        if: ${{ inputs.language == 'python' }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ inputs.python-version }}

      # Lint only (respecting the repo's [tool.ruff] config). Format-enforcement
      # is intentionally NOT part of the baseline gate — adding it later is a
      # deliberate per-repo step, not a surprise that blocks every auto-merge.
      - name: Ruff lint
        if: ${{ inputs.language == 'python' }}
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: uvx "ruff@$RUFF_VERSION" check .

      # Opt-in (ruff-format: true): enforce formatting as a hard gate.
      - name: Ruff format check
        if: ${{ inputs.language == 'python' && inputs.ruff-format }}
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
        run: uvx "ruff@$RUFF_VERSION" format --check .

      # Opt-in (ty: true): run the `ty` type checker over ty-paths. Needs the
      # project's deps, so sync first. Path comes via env (never interpolate a
      # caller input straight into the run line).
      - name: Ty type check
        if: ${{ inputs.language == 'python' && inputs.ty }}
        env:
          TY_PATHS: ${{ inputs.ty-paths }}
        run: |
          set -euo pipefail
          uv sync --all-extras --dev 2>/dev/null || uv sync 2>/dev/null || true
          uv run ty check $TY_PATHS

      - name: Pytest (only if a test suite is present)
        if: ${{ inputs.language == 'python' }}
        run: |
          set -euo pipefail
          # Detect a suite robustly: `ls a b c` exits non-zero if ANY glob is
          # unmatched, so it skipped real suites whenever only one naming
          # convention was present. compgen -G tests each pattern independently
          # and is true if any matches.
          if compgen -G "tests/test_*.py" >/dev/null || compgen -G "tests/*_test.py" >/dev/null || compgen -G "test_*.py" >/dev/null; then
            uv sync --all-extras --dev 2>/dev/null || uv sync 2>/dev/null || true
            uv run pytest -q
          else
            echo "no pytest suite found — skipping"
          fi

      # ---- Node/TS: install via the detected package manager, run scripts ------
      - name: Set up Node
        if: ${{ inputs.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install + lint + build + test
        if: ${{ inputs.language == 'node' }}
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run --if-present lint
            pnpm run --if-present build
            pnpm run --if-present test
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
            yarn run --if-present lint
            yarn run --if-present build
            yarn run --if-present test
          else
            npm ci || npm install
            npm run --if-present lint
            npm run --if-present build
            npm test --if-present
          fi

      # ---- Static / content repos: nothing to test, just confirm it's there ----
      - name: Static check
        if: ${{ inputs.language == 'static' }}
        run: |
          set -euo pipefail
          test -n "$(ls -A)" || { echo "::error::repository is empty"; exit 1; }
          echo "static repo — no build/test, ok"
